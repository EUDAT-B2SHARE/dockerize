server {
        listen 80;
        charset utf-8;

        server_tokens           off;
        server_name *eudat.eu; # change it with the correct server name

        # Remove unwanted headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Host "";
        proxy_set_header X-Forwarded-Server "";

        # The `max-age` parameter specifies the amount of time that the browser should remember the HSTS policy.
        # The `includeSubDomains` parameter specifies that the HSTS policy should apply to all subdomains of the domain.
        # The `preload` parameter tells the browser to cache the HSTS policy in its permanent storage, so that it can be used even if the browser is not connected to the internet.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevents browsers from interpreting files as a different MIME type than what is declared and prevents MIME type sniffing
        add_header X-Content-Type-Options "nosniff";

        # https://geekflare.com/httponly-secure-cookie-nginx/
        # Path=/: Restricts the cookie to be valid for the entire site.
        # HttpOnly: Prevents JavaScript from accessing cookies, protecting against XSS attacks.
        # Secure: Ensures the cookie is sent only over HTTPS, preventing interception in plaintext HTTP.
        add_header Set-Cookie "Path=/; HttpOnly; Secure";

        # Allows embedding only on pages from the same domain, mitigating clickjacking attacks.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # no-referrer: Prevents any referrer information from being sent to other websites, enhancing privac
        add_header Referrer-Policy "no-referrer";


        location /oai2d {
                proxy_pass http://b2share:5000/api/oai2d;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
                return 301 https://$http_host$request_uri;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
                root /usr/share/nginx/html;
        }
}

server {
        listen 443 ssl;
        http2         on;
        charset       utf-8;
        server_tokens off;
        server_name *eudat.eu; # change it with the correct server name

        # Sanitize headers to prevent host header injection
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Host "";
        proxy_set_header X-Forwarded-Server "";

        ssl_certificate         /etc/ssl/b2share.crt;
        ssl_certificate_key     /etc/ssl/b2share.key;
        ssl_protocols           TLSv1.2 TLSv1.3;
        ssl_ciphers             !aNULL:!MD5:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # The `max-age` parameter specifies the amount of time that the browser should remember the HSTS policy.
        # The `includeSubDomains` parameter specifies that the HSTS policy should apply to all subdomains of the domain.
        # The `preload` parameter tells the browser to cache the HSTS policy in its permanent storage, so that it can be used even if the browser is not currently connec$
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Prevents browsers from interpreting files as a different MIME type than what is declared and prevents MIME type sniffing
        add_header X-Content-Type-Options "nosniff";

        # https://geekflare.com/httponly-secure-cookie-nginx/
        # Path=/: Restricts the cookie to be valid for the entire site.
        # HttpOnly: Prevents JavaScript from accessing cookies, protecting against XSS attacks.
        # Secure: Ensures the cookie is sent only over HTTPS, preventing interception in plaintext HTTP.
        add_header Set-Cookie "Path=/; HttpOnly; Secure";

        # Allows embedding only on pages from the same domain, mitigating clickjacking attacks.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # no-referrer: Prevents any referrer information from being sent to other websites, enhancing privac
        add_header Referrer-Policy "no-referrer";


        client_body_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/files {
                proxy_pass http://b2share:5000;
                proxy_request_buffering off;
                proxy_max_temp_file_size 0;
                client_max_body_size 1000g;
        }

        location / {
                proxy_pass http://b2share:5000;
                client_max_body_size 100m;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
                root /usr/share/nginx/html;
        }
}
